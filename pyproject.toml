[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tender-mcp"
version = "0.1.0"
description = "MCP server aggregating tenders from CPPP, GeM, and HMEL for Swamina International"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "lxml>=5.0.0",
    "pypdf>=5.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tender-refresh = "scripts.refresh:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
